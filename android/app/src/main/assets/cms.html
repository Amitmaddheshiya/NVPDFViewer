<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NV TV CMS</title><style>
:root{color-scheme:dark;--bg:#10151d;--card:#1c2430;--blue:#1677ff;--red:#aa3b45;--muted:#aeb8c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:16px system-ui,sans-serif}.wrap{max-width:820px;margin:auto;padding:20px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box,.card{background:var(--card);border:1px solid #344156;border-radius:14px;padding:22px}.box{width:min(100%,380px)}h1{margin:0 0 6px;font-size:27px}h2{font-size:19px;margin:0 0 12px}.muted{color:var(--muted);line-height:1.45}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.value{background:#10151d;border-radius:9px;padding:11px}.value small{display:block;color:var(--muted)}.value b{font-size:17px}input,button{font:inherit;padding:12px;border-radius:9px}input{width:100%;background:#10151d;color:#fff;border:1px solid #4a5b74}button{border:0;background:#2e405b;color:#fff;font-weight:750;cursor:pointer;min-height:46px}button.primary{background:var(--blue)}button.danger{background:var(--red)}button:disabled{opacity:.5}.card{margin-top:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:180px}.msg{min-height:23px;margin-top:10px}.ok{color:#70e5a7}.bad{color:#ff9999}.loginQr{width:142px;height:142px;background:#fff;border-radius:8px;display:block;margin:16px auto 8px}.tvAddress{text-align:center;color:#ffd600;font-weight:700;word-break:break-all}@media(max-width:600px){.status{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}
</style></head><body>
<section id="loginPage" class="login"><div class="box"><h1>NV TV CMS</h1><img class="loginQr" src="/api/qr.png" alt="CMS QR code"><div class="tvAddress" id="loginHost"></div><input id="password" type="password" inputmode="numeric" placeholder="Enter Password" autofocus><button id="loginButton" class="primary" style="width:100%;margin-top:12px">Login</button><div id="loginMessage" class="msg"></div></div></section>
<main id="cms" class="wrap hidden"><h1>NV TV Control</h1><p class="muted" id="host"></p><section class="card"><div class="status"><div class="value"><small>Viewer</small><b id="viewer">-</b></div><div class="value"><small>PDF</small><b id="document">-</b></div><div class="value"><small>Page</small><b id="page">-</b></div><div class="value"><small>Timer</small><b id="timer">-</b></div></div><p class="muted" id="filename">No PDF open</p></section>
<section class="card"><h2>Upload PDFs</h2><div class="row"><input class="grow" id="pdfs" type="file" accept="application/pdf,.pdf" multiple><button id="uploadButton" class="primary">Upload</button><button id="clearButton" class="danger">Clear all</button></div></section>
<section class="card"><h2>Viewer controls</h2><div class="grid"><button data-viewer-action="previous">Previous</button><button data-viewer-action="next">Next</button><button data-viewer-action="rotate">Rotate</button><button data-viewer-action="fullscreen">Fullscreen</button><button id="timerButton" data-viewer-action="timer">Timer ON</button><button class="danger" data-viewer-action="close">Close</button></div><div class="row" style="margin-top:12px"><input class="grow" id="seconds" type="number" min="1" max="3600" value="5" aria-label="Timer seconds"><button id="setSecondsButton">Set seconds</button></div><p class="muted">Timer loops every page of every PDF until switched off.</p></section><div id="message" class="msg"></div></main>
<script>
const $=id=>document.getElementById(id),api='/api/';let token=sessionStorage.getItem('nvCmsToken')||'',busy=false;$('host').textContent=location.origin;$('loginHost').textContent=location.origin;
function say(text,bad=false,target='message'){$(target).textContent=text;$(target).className='msg '+(bad?'bad':'ok')}
async function req(path,options={}){options.headers={...(options.headers||{}),'X-CMS-TOKEN':token};let r=await fetch(api+path,options),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){try{let code=$('password').value.trim();if(!/^\d{4,}$/.test(code))throw Error('Enter the Enter Password.');let d=await req('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:code})});token=d.token;sessionStorage.setItem('nvCmsToken',token);$('loginPage').classList.add('hidden');$('cms').classList.remove('hidden');refresh();}catch(e){say(e.message,true,'loginMessage')}}
function show(s){$('viewer').textContent=s.viewerOpen?'OPEN':'CLOSED';$('document').textContent=s.documentCount?`${s.documentIndex}/${s.documentCount}`:'-';$('page').textContent=s.pageCount?`${s.page}/${s.pageCount}`:'-';$('timer').textContent=s.timerEnabled?`${s.timerSeconds}s ON`:'OFF';$('timerButton').textContent=s.timerEnabled?'Timer OFF':'Timer ON';$('filename').textContent=s.filename||'No PDF open';if(s.timerSeconds)$('seconds').value=s.timerSeconds}
async function refresh(){if(!token)return;try{show(await req('status'))}catch(e){if(e.message.includes('login')){sessionStorage.removeItem('nvCmsToken');location.reload()}else say(e.message,true)}}
async function sendViewerAction(type,payload={}){if(busy)return;busy=true;try{await req('command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,payload})});await refresh();say('Applied on TV.')}catch(e){say(e.message,true)}finally{busy=false}}
async function uploadPdfs(){let files=[...$('pdfs').files];if(!files.length)return say('Select PDF file(s).',true);busy=true;try{for(let file of files){let f=new FormData();f.append('filename',file.name);f.append('file',file,file.name);await req('upload',{method:'POST',body:f})}$('pdfs').value='';await refresh();say('PDFs uploaded.')}catch(e){say(e.message,true)}finally{busy=false}}
function clearLibrary(){if(confirm('Delete all saved PDFs from TV?'))sendViewerAction('clearLibrary')}
// Do not use inline onclick handlers. On Android/Chrome some DOM or browser
// integrations expose a global named `command`, which replaced our previous
// command() function and caused "command is not a function" before any HTTP
// request was sent.
document.querySelectorAll('[data-viewer-action]').forEach(button=>button.addEventListener('click',()=>sendViewerAction(button.dataset.viewerAction)));
$('setSecondsButton').addEventListener('click',()=>sendViewerAction('timerSeconds',{seconds:+$('seconds').value}));
$('loginButton').addEventListener('click',login);
$('uploadButton').addEventListener('click',uploadPdfs);
$('clearButton').addEventListener('click',clearLibrary);
if(token){$('loginPage').classList.add('hidden');$('cms').classList.remove('hidden');refresh()}setInterval(refresh,1000);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
